name: adafruit-sensor
version: "*"
description: "Adafruit Unified Sensor Library"
dependencies:
  idf:
    version: ">=4.4.0"
  # If your component depends on Arduino

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2

# examples:
#   - path: examples/basic_motor_control
    
files:
  exclude:
    - "*.md"
    - "examples/**"
    - "test/**"
    - "libs/*/examples/**"
    - "libs/*/.git/**"
    - "libs/*/test/**"
    - "libs/*/tests/**"