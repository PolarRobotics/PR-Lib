name: adafruit-lis3mdl
version: "*"
description: "Adafruit LIS3MDL 3D Magnetometer"

dependencies:
  idf:
    version: ">=4.4.0"
  # If your component depends on Arduino
  adafruit-sensor:
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit-sensor
  adafruit-busio:
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit-busio

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2

# examples:
#   - path: examples/basic_motor_control
    
files:
  exclude:
    - "*.md"
    - "examples/**"
    - "test/**"
    - "libs/*/examples/**"
    - "libs/*/.git/**"
    - "libs/*/test/**"
    - "libs/*/tests/**"