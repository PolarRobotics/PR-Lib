name: pr-lib
version: "1.0.0"
description: "Polar Robotics custom library for ESP32 robotics applications"
url: https://github.com/PolarRobotics/PR-Lib
repository: https://github.com/PolarRobotics/PR-Lib.git
documentation: https://github.com/PolarRobotics/PR-Lib#readme

dependencies:
  idf:
    version: ">=4.4.0"
  # If your component depends on Arduino
  espressif/arduino-esp32: "^3.0.0"

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2

# examples:
#   - path: examples/basic_motor_control
    
files:
  exclude:
    - "*.md"
    - "examples/**"
    - "test/**"
    - "libs/*/examples/**"
    - "libs/*/.git/**"
    - "libs/*/test/**"
    - "libs/*/tests/**"